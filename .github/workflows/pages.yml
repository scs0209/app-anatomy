# 사이트를 GitHub Pages에 올린다. main의 사이트·코어·규칙이 바뀌면 다시 올리고, 수동으로도 돌릴 수 있다.
# 저장소가 공개일 때만 돈다(비공개 저장소의 무료 계정에서는 Pages를 쓸 수 없다).
# 필요한 저장소 설정: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# 사이트는 상대 경로만 쓰므로 https://<사용자>.github.io/<저장소>/ 아래에서도 그대로 동작한다.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "dist/anatomy_core.wasm", "host/loader.mjs", "rules/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # 저장소에 실린 해석기와 규칙으로 정적 사이트를 모은다(갤러리 결과 포함)
      - name: Build the site
        run: node site/build.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
